<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://vfxblubjsxwseacmslnu.supabase.co https://api.pwnedpasswords.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0f1e">
<title>TVO · Connecter ma télé</title>
<style>
:root{--bg:#0a0f1e;--s:#151e3b;--s2:#1e2a4f;--t:#f3f6ff;--m:#9ea9c6;--c:#8fc2ff;--g:linear-gradient(135deg,#5c9bff,#3d7cff 45%,#2b5bea)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(120% 60% at 50% -10%,#17357f,var(--bg) 60%) fixed;color:var(--t);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif}
main{max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 18px calc(env(safe-area-inset-bottom) + 28px);display:grid;gap:16px}
.logo{width:180px;margin:0 auto}.logo svg{width:100%;height:auto;display:block}
h1{font-size:22px;margin:0;text-align:center}.sub{color:var(--m);text-align:center;margin:-8px 0 0;font-size:14.5px}
.card{background:var(--s);border:1px solid rgba(160,190,255,.12);border-radius:22px;padding:18px;display:grid;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--s2);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--m);font-weight:700;font-size:14px;padding:10px;border-radius:999px}.seg button.on{background:var(--g);color:#fff}
input[type=text],input[type=password]{width:100%;font-size:16px;padding:14px;border-radius:14px;border:1px solid rgba(160,190,255,.18);background:#0f1730;color:var(--t)}
.btn{border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;background:var(--g);color:#fff;box-shadow:0 8px 24px rgba(61,124,255,.38)}
.btn:disabled{opacity:.6}label{display:flex;gap:8px;align-items:flex-start;color:var(--m);font-size:13.5px}a{color:var(--c)}
.msg{min-height:18px;font-size:14px;color:#ff8a8a}.ok{color:#4ade80}.code{font-size:30px;font-weight:800;letter-spacing:.12em;text-align:center}
.small{font-size:12.5px;color:var(--m);text-align:center}
</style></head><body><main>
<div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -40 640 280"><defs>   <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34E4D8"/><stop offset=".5" stop-color="#3D7CFF"/><stop offset="1" stop-color="#2A4FE6"/></linearGradient>   <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>   <radialGradient id="bg" cx=".3" cy=".25" r="1"><stop offset="0" stop-color="#1B3A8C"/><stop offset=".6" stop-color="#0C1634"/><stop offset="1" stop-color="#070B1A"/></radialGradient>   <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1d4dff" flood-opacity=".45"/></filter> </defs><g transform="translate(0 0)"><path d="M0 0 H150 V40 H96 V200 H54 V40 H0 Z" fill="#F3F6FF"/><path d="M170 0 H215 L262 146 L309 0 H354 L284 200 H240 Z" fill="#F3F6FF"/></g> <g transform="translate(372 -28) scale(.5)"><g filter="url(#sh)"><circle cx="256" cy="256" r="196" fill="none" stroke="url(#g)" stroke-width="36"/><path d="M212 172 Q212 152 230 162 L352 238 Q368 248 352 258 L230 334 Q212 344 212 324 Z" transform="translate(6 10)" fill="url(#g)"/></g><path d="M108 210 A156 156 0 0 1 300 104" fill="none" stroke="url(#gl)" stroke-width="14" stroke-linecap="round"/></g></svg></div>
<h1>Connecter ma télé</h1><p class="sub">Code affiché sur la télé : <b id="code">—</b></p>
<div class="card" id="box">
  <div class="seg" id="seg"><button class="on" data-m="in">J'ai déjà un compte</button><button data-m="up">Créer un compte</button></div>
  <input type="text" id="u" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="username" placeholder="Identifiant">
  <input type="password" id="p" autocomplete="current-password" placeholder="Mot de passe">
  <input type="password" id="p2" autocomplete="new-password" placeholder="Confirme le mot de passe" hidden>
  <input type="text" id="em" inputmode="email" autocomplete="email" autocapitalize="off" placeholder="E-mail (pour être prévenu de l'activation)" hidden>
  <label id="cg" hidden><input type="checkbox" id="acc"> J'accepte les conditions d'utilisation et la politique de confidentialité de TVO (consultables dans l'appli).</label>
  <button class="btn" id="go">Connecter la télé</button>
  <div class="msg" id="msg"></div>
</div>
<p class="small">Page sécurisée (HTTPS). Ton mot de passe est envoyé chiffré et n'est jamais enregistré sur cette page.<br>Un nouveau compte doit être validé par l'administrateur avant de pouvoir regarder.</p>
</main>
<script>
(function(){
  var SB="https://vfxblubjsxwseacmslnu.supabase.co/rest/v1/rpc/", K="sb_publishable_HojETqgwpBMQ_cjDzMNaAg_WGCFMaED";
  var q=new URLSearchParams(location.search), code=(q.get("code")||"").replace(/\D/g,""), key=q.get("k")||"";
  history.replaceState(null,"",location.pathname); // la clé ne reste pas dans l'historique
  var $=function(i){return document.getElementById(i)}, mode="in";
  $("code").textContent = code.length===6 ? code.slice(0,3)+" "+code.slice(3) : "—";
  if(code.length!==6||!/^[0-9a-f]{64}$/.test(key)){ $("box").innerHTML='<div class="msg">QR code incomplet. Scanne à nouveau le QR code affiché sur la télé.</div>'; return; }
  function rpc(fn,b){return fetch(SB+fn,{method:"POST",headers:{apikey:K,Authorization:"Bearer "+K,"Content-Type":"application/json"},body:JSON.stringify(b)})
    .then(function(r){return r.text().then(function(t){var j=t?JSON.parse(t):null; if(!r.ok) throw new Error((j&&j.message)||"Erreur "+r.status); return j;});});}
  $("seg").addEventListener("click",function(e){var b=e.target.closest("[data-m]"); if(!b) return; mode=b.dataset.m;
    [].forEach.call($("seg").children,function(x){x.classList.toggle("on",x===b)}); $("p2").hidden=$("cg").hidden=$("em").hidden=mode!=="up";
    $("go").textContent = mode==="up" ? "Créer mon compte et connecter la télé" : "Connecter la télé"; $("msg").textContent="";});
  $("go").addEventListener("click",function(){
    var u=$("u").value.trim().toLowerCase(), p=$("p").value, m=$("msg"), g=$("go"); m.className="msg"; m.textContent="";
    if(mode==="up"){ if(p!==$("p2").value){m.textContent="Les mots de passe ne correspondent pas";return;} if(!$("acc").checked){m.textContent="Accepte les conditions pour créer ton compte";return;} }
    g.disabled=true; g.textContent="Patiente…";
    var start = mode==="up" ? rpc("tvo_register",{p_user:u,p_pass:p,p_id:crypto.randomUUID(),p_email:$("em").value.trim()||null}) : Promise.resolve();
    start.then(function(){return rpc("tvo_auth",{p_user:u,p_pass:p});})
      .then(function(a){ if(!a) throw new Error("Identifiant ou mot de passe incorrect");
        return rpc("tvo_login_approve",{p_code:code,p_id:a.sync_id,p_key:key}).then(function(ok){ if(!ok) throw new Error("Code expiré : affiche un nouveau QR code sur la télé.");
          rpc("tvo_logout",{p_token:a.token}).catch(function(){});
          $("box").innerHTML='<div class="code ok">✓</div><b style="text-align:center">Télé connectée</b><p class="small">'+(a.status==="active"?"Tu peux regarder TVO sur ta télé.":"Ton compte attend la validation de l'administrateur. La télé se débloquera dès qu'il l'aura validé.")+'</p>';});})
      .catch(function(e){ m.textContent=e.message; g.disabled=false; g.textContent = mode==="up" ? "Créer mon compte et connecter la télé" : "Connecter la télé"; });
  });
})();
</script></body></html>
