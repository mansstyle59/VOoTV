<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src https://www.youtube-nocookie.com https://www.youtube.com; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Bande-annonce · TVO</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
body.bg iframe{top:50%;left:50%;inset:auto;width:100vw;height:56.25vw;min-height:100vh;min-width:177.78vh;transform:translate(-50%,-50%);pointer-events:none}</style>
</head><body>
<script>
// Page relais : YouTube exige une adresse https d'origine (erreur 153 dans les applis sans adresse web).
(function () {
  var q = new URLSearchParams(location.search), v = q.get("v") || "";
  if (!/^[A-Za-z0-9_-]{6,20}$/.test(v)) return;
  var bg = q.get("bg") === "1";
  if (bg) document.body.className = "bg";
  var p = new URLSearchParams({ autoplay: "1", playsinline: "1", rel: "0", modestbranding: "1", hl: "fr", cc_lang_pref: "fr", iv_load_policy: "3" });
  if (bg) { p.set("controls", "0"); p.set("loop", "1"); p.set("playlist", v); p.set("disablekb", "1"); p.set("fs", "0"); }
  if (q.get("mute") === "1") p.set("mute", "1");
  var f = document.createElement("iframe");
  f.src = "https://www.youtube-nocookie.com/embed/" + v + "?" + p.toString();
  f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
  f.allowFullscreen = true;
  f.referrerPolicy = "strict-origin-when-cross-origin";
  document.body.appendChild(f);
})();
</script>
</body></html>
