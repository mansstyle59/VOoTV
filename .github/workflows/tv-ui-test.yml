name: Test TV (télé virtuelle, télécommande)

# Lance l'APK sur une télé Android virtuelle, appuie sur la télécommande sur une fiche film et une fiche série,
# et garde une capture d'écran après chaque appui (artefact « captures-tv »).
on:
  workflow_dispatch:
    inputs:
      movie: { description: "Film (id IMDb)", default: "tt0099785" }
      series: { description: "Série (id IMDb)", default: "tt0903747" }

jobs:
  tv-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler l'APK de test (debug)
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Activer l'accélération (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Télé virtuelle + parcours télécommande
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MOVIE: ${{ inputs.movie }}
          SERIES: ${{ inputs.series }}
          TMDB: ${{ secrets.TVO_TEST_TMDB }}
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/tv-remote-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: captures-tv, path: shots/ }
