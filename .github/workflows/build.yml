name: Build TVO (Android TV)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          UPDATE_REPO: ${{ github.repository }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/TVO-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TVO-1.0.${{ github.run_number }}
          path: dist/*.apk

      - name: Publier la version (mise à jour automatique dans l'appli)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TVO 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: dist/*.apk
          make_latest: true
