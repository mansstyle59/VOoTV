name: Build TVO (TV, Android, iPhone)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_NUMBER: ${{ github.run_number }}
  UPDATE_REPO: ${{ github.repository }}

jobs:
  tv:
    name: APK Android TV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler l'APK TV
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p dist && cp app/build/outputs/apk/release/app-release.apk "dist/TVO-TV-1.0.${BUILD_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: tv, path: dist/* }

  mobile:
    name: APK téléphone Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Préparer l'appli mobile
        working-directory: mobile
        run: |
          npm ci
          printf 'window.TVO_VERSION = { code: %s, name: "1.0.%s", repo: "%s" };\n' "$BUILD_NUMBER" "$BUILD_NUMBER" "$UPDATE_REPO" > www/version.js
          cp node_modules/hls.js/dist/hls.min.js www/vendor/hls.min.js
          npx cap sync android
      - name: Compiler l'APK mobile
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../../dist && cp app/build/outputs/apk/release/app-release.apk "../../dist/TVO-Mobile-1.0.${BUILD_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: mobile, path: dist/* }

  ios:
    name: IPA iPhone (non signé, pour ESign / KSign)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: Préparer l'appli iOS
        working-directory: mobile
        run: |
          npm ci
          printf 'window.TVO_VERSION = { code: %s, name: "1.0.%s", repo: "%s" };\n' "$BUILD_NUMBER" "$BUILD_NUMBER" "$UPDATE_REPO" > www/version.js
          cp node_modules/hls.js/dist/hls.min.js www/vendor/hls.min.js
          npx cap sync ios
      - name: Compiler l'IPA
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="1.0.${BUILD_NUMBER}" CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          mkdir -p ../../../dist
          zip -qr "../../../dist/TVO-iOS-1.0.${BUILD_NUMBER}.ipa" Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: dist/* }

  release:
    name: Publier la version
    needs: [tv, mobile, ios]
    if: ${{ !cancelled() && needs.tv.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TVO 1.0.${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message }}

            - TVO-TV : Android TV / box (télécommande)
            - TVO-Mobile : téléphone Android
            - TVO-iOS : iPhone (à installer avec ESign ou KSign)
          files: dist/*
          make_latest: true
